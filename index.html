<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acappella Hub - Google Drive 악보 뷰어</title>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #f0f0f0;
      --text-muted: #a0a0a0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #383838;
      --accent-pitch: #1d4ed8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

/* 헤더를 억지로 줄바꿈하지 않고 모바일에서 가로 스크롤 가능하게 변경 */
header {
  background: var(--panel);
  padding: 8px 12px;
  display: flex;
  flex-direction: column; /* 1단: 곡 선택 및 도구, 2단: 피치 및 페이지 조작 */
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.header-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  overflow-x: auto; /* 버튼이 많아도 화면 밖으로 깨지지 않고 부드럽게 스크롤 */
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}

/* 스크롤바 숨기기 (깔끔한 UI) */
.header-row::-webkit-scrollbar { display: none; }

button, select {
  flex-shrink: 0; /* 버튼 글자가 세로로 찌그러지는 현상 방지 */
  white-space: nowrap;
  font-size: 13px;
  padding: 6px 10px;
}

#songSelect {
  flex: 1; /* 모바일에서 곡 제목이 길어도 비율에 맞게 늘어남 */
  min-width: 140px;
}

/* 캔버스가 모바일 가로 너비 100%에 꽉 차도록 설정 */
main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px;
  -webkit-overflow-scrolling: touch;
}

canvas {
  width: 100% !important; /* 기기 너비에 100% 맞춤 */
  height: auto !important;
  max-width: 900px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}

    /* 무대용 흑백 반전 모드 */
    body.invert-mode canvas {
      filter: invert(0.92) hue-rotate(180deg);
    }

    /* 로딩 인디케이터 */
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 상단 컨트롤 헤더 -->
<header>
  <!-- 1번째 줄: 곡 선택, 링크 추가, 삭제, 새로고침, 반전 -->
  <div class="header-row">
    <select id="songSelect">
      <option value="">악보 불러오는 중...</option>
    </select>
    <button class="btn-primary" id="openLinkModalBtn">+ 링크</button>
    <button id="deleteLocalBtn" class="btn-danger" style="display: none;">삭제</button>
    <button id="refreshBtn" title="새로고침">🔄</button>
    <button id="toggleInvert">반전</button>
  </div>

  <!-- 2번째 줄: 첫 음 피치바 & 페이지 넘김 -->
  <div class="header-row" style="justify-content: space-between;">
    <div class="flex-row" id="pitchBar"></div>
    <div class="flex-row" style="margin-left: auto;">
      <button id="prevPage">◀ 이전</button>
      <span id="pageIndicator" style="font-size: 13px; padding: 0 4px;">- / -</span>
      <button id="nextPage">다음 ▶</button>
    </div>
  </div>
</header>

  <!-- 메인 뷰어 영역 -->
  <main id="viewerMain">
    <div id="statusView" class="status-message">
      <div class="spinner" id="loadingSpinner"></div>
      <p id="statusText">구글 드라이브 폴더에서 악보 목록을 불러오는 중입니다...</p>
    </div>
    <canvas id="pdfCanvas" style="display: none;"></canvas>
  </main>

  <script>
    // ==========================================
    // ⚙️ 1. 구글 드라이브 API 설정
    // ==========================================
    const GOOGLE_API_KEY = "AIzaSyCvRa2jV0lWoX9-rayyu5vNG7K4GuMUSSQ";   // 발급받은 API 키
    const DRIVE_FOLDER_ID = "1BDl7bfBY0S0kWRvtbJ5Kqgl9o9HgwUEj";       // 공유 설정된 구글 드라이브 폴더 ID

    // PDF.js 워커 연결
    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ==========================================
    // 🎵 2. Web Audio API 피치파이프 엔진
    // ==========================================
    let audioCtx = null;
    const noteFrequencies = {
      "C3": 130.81, "C#3": 138.59, "DB3": 138.59, "D3": 146.83, "D#3": 155.56, "EB3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "GB3": 185.00, "G3": 196.00, "G#3": 207.65, "AB3": 207.65, "A3": 220.00, "A#3": 233.08, "BB3": 233.08, "B3": 246.94,
      "C4": 261.63, "C#4": 277.18, "DB4": 277.18, "D4": 293.66, "D#4": 311.13, "EB4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "GB4": 369.99, "G4": 392.00, "G#4": 415.30, "AB4": 415.30, "A4": 440.00, "A#4": 466.16, "BB4": 466.16, "B4": 493.88,
      "C5": 523.25, "C#5": 554.37, "D5": 587.33, "EB5": 622.25, "E5": 659.25
    };

    function playNote(noteName) {
      if (!noteName) return;
      const clean = noteName.trim().toUpperCase();
      const freq = noteFrequencies[clean];
      if (!freq) {
        alert(`지원되지 않는 음 형식입니다: ${noteName}\n(예: C4, Eb3, F#3 형식으로 입력해주세요)`);
        return;
      }

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // 자연스러운 Envelope 적용 (어택 -> 서스테인 -> 페이드아웃)
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.8);
    }

    // ==========================================
    // 📂 3. 구글 드라이브 파일명 파싱 로직
    // ==========================================
    // 지원 포맷: "곡제목 [S:E4,A:C4,T:G3,B:C3].pdf" 또는 단순 "곡제목.pdf"
    function parseFileName(fileName) {
      const cleanName = fileName.replace(/\.pdf$/i, '');
      const match = cleanName.match(/^(.*?)\s*\[(.*?)\]$/);

      if (!match) {
        return { title: cleanName, notes: {} };
      }

      const title = match[1].trim();
      const notesStr = match[2];
      const notes = {};

      notesStr.split(',').forEach(partItem => {
        const [part, note] = partItem.split(':');
        if (part && note) {
          notes[part.trim().toUpperCase()] = note.trim().toUpperCase();
        }
      });

      return { title, notes };
    }

    // ==========================================
    // 🌐 4. 구글 드라이브 API 연동
    // ==========================================
    let driveSongs = [];
    let currentPdfDoc = null;
    let currentPageNum = 1;

    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const songSelect = document.getElementById('songSelect');
    const pitchBar = document.getElementById('pitchBar');
    const pageIndicator = document.getElementById('pageIndicator');
    const statusView = document.getElementById('statusView');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('loadingSpinner');

    async function fetchDriveSongs() {
      showStatus("구글 드라이브 폴더를 조회하는 중...", true);
      songSelect.innerHTML = '<option value="">조회 중...</option>';

      const query = `'${DRIVE_FOLDER_ID}' in parents and mimeType = 'application/pdf' and trashed = false`;
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&orderBy=name&key=${GOOGLE_API_KEY}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        const data = await res.json();

        driveSongs = (data.files || []).map(file => {
          const meta = parseFileName(file.name);
          return {
            id: file.id,
            fileName: file.name,
            title: meta.title,
            notes: meta.notes
          };
        });

        if (driveSongs.length === 0) {
          showStatus("폴더에 등록된 PDF 악보가 없습니다.<br>구글 드라이브 폴더에 PDF를 업로드해 주세요.", false);
          songSelect.innerHTML = '<option value="">(등록된 곡 없음)</option>';
          return;
        }

        // 셀렉트 박스 갱신
        songSelect.innerHTML = '<option value="">곡을 선택하세요...</option>';
        driveSongs.forEach(song => {
          const opt = document.createElement('option');
          opt.value = song.id;
          opt.textContent = song.title;
          songSelect.appendChild(opt);
        });

        // 첫 번째 곡 자동 로드
        songSelect.value = driveSongs[0].id;
        loadSong(driveSongs[0].id);

      } catch (err) {
        console.error("구글 드라이브 조회 실패:", err);
        showStatus("구글 드라이브를 불러오지 못했습니다.<br>API 키, 폴더 ID 및 공유 권한(링크가 있는 모든 사용자-뷰어)을 확인해주세요.", false);
        songSelect.innerHTML = '<option value="">불러오기 실패</option>';
      }
    }

    // 선택한 곡의 PDF 스트리밍 로드
    async function loadSong(fileId) {
      const song = driveSongs.find(s => s.id === fileId);
      if (!song) return;

      // 1) 파트별 첫 음 버튼 생성
      pitchBar.innerHTML = '';
      if (song.notes && Object.keys(song.notes).length > 0) {
        Object.entries(song.notes).forEach(([part, note]) => {
          const btn = document.createElement('button');
          btn.className = 'btn-pitch';
          btn.textContent = `${part}: ${note}`;
          btn.onclick = () => playNote(note);
          pitchBar.appendChild(btn);
        });
      }

      // 2) PDF 바이너리 다운로드 및 렌더링
      showStatus(`'${song.title}' 악보를 다운로드 중...`, true);
      canvas.style.display = 'none';

      const downloadUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${GOOGLE_API_KEY}`;

      try {
        const response = await fetch(downloadUrl);
        if (!response.ok) throw new Error(`다운로드 실패 (${response.status})`);
        
        const arrayBuffer = await response.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        currentPdfDoc = await loadingTask.promise;

        currentPageNum = 1;
        statusView.style.display = 'none';
        canvas.style.display = 'block';
        renderPage(currentPageNum);

      } catch (e) {
        console.error("악보 렌더링 실패:", e);
        showStatus("악보를 불러오는 중 에러가 발생했습니다.", false);
      }
    }

function renderPage(num) {
  if (!currentPdfDoc) return;
  
  currentPdfDoc.getPage(num).then(page => {
    // 뷰어 컨테이너 너비 기준으로 딱 맞춤 (최대 900px)
    const containerWidth = Math.min(document.getElementById('viewerMain').clientWidth - 16, 900);
    const unscaledViewport = page.getViewport({ scale: 1.0 });
    const scale = containerWidth / unscaledViewport.width;
    
    // 아이폰 등 고해상도(Retina) 디스플레이 선명도 보정
    const dpr = window.devicePixelRatio || 1;
    const viewport = page.getViewport({ scale: scale * dpr });

    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = `${viewport.width / dpr}px`;
    canvas.style.height = `${viewport.height / dpr}px`;

    const renderContext = {
      canvasContext: ctx,
      viewport: viewport
    };

    page.render(renderContext);
    pageIndicator.textContent = `${num} / ${currentPdfDoc.numPages}`;
  });
}

    function showStatus(text, isLoading) {
      statusView.style.display = 'block';
      statusText.innerHTML = text;
      spinner.style.display = isLoading ? 'block' : 'none';
    }

    // ==========================================
    // 🎮 5. 사용자 조작 및 이벤트 제어
    // ==========================================
    function nextPage() {
      if (currentPdfDoc && currentPageNum < currentPdfDoc.numPages) {
        currentPageNum++;
        renderPage(currentPageNum);
      }
    }

    function prevPage() {
      if (currentPdfDoc && currentPageNum > 1) {
        currentPageNum--;
        renderPage(currentPageNum);
      }
    }

    document.getElementById('nextPage').onclick = nextPage;
    document.getElementById('prevPage').onclick = prevPage;
    document.getElementById('refreshBtn').onclick = fetchDriveSongs;
    songSelect.onchange = (e) => { if (e.target.value) loadSong(e.target.value); };

    // 화면 터치/클릭 넘김 (우측: 다음, 좌측: 이전)
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX > rect.width / 2) nextPage();
      else prevPage();
    });

    // 키보드 방향키 / 블루투스 페달
    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) nextPage();
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) prevPage();
    });

    // 반전 모드 토글
    document.getElementById('toggleInvert').onclick = () => {
      document.body.classList.toggle('invert-mode');
    };

    // 앱 시작
    fetchDriveSongs();
  </script>
</body>
</html>
