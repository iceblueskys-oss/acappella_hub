<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Acappella Studio</title>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      /* Apple Pastel Palette */
      --bg-gradient: linear-gradient(135deg, #f0f4fd 0%, #fdf2f8 50%, #f5f3ff 100%);
      --surface: rgba(255, 255, 255, 0.78);
      --surface-border: rgba(255, 255, 255, 0.85);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      
      /* Part Pastel Accents */
      --color-sop: #fda4af; 
      --color-alto: #fed7aa; 
      --color-tenor: #a7f3d0; 
      --color-bass: #bae6fd; 
      --color-lead: #e9d5ff; 

      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 플로팅 헤더 */
    header {
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--surface-border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .header-row::-webkit-scrollbar { display: none; }

    select, button, input {
      font-family: inherit;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      flex-shrink: 0;
    }
    button:active { transform: scale(0.96); }
    button:hover { background: #ffffff; }

    #songSelect {
      flex: 1;
      min-width: 160px;
      font-weight: 600;
      padding-right: 28px;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%236B7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }

    .part-btn {
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease;
    }
    .part-btn:active { transform: scale(0.92); }
    .part-sop { background: var(--color-sop); color: #881337; }
    .part-alto { background: var(--color-alto); color: #7c2d12; }
    .part-tenor { background: var(--color-tenor); color: #064e3b; }
    .part-bass { background: var(--color-bass); color: #0c4a6e; }
    .part-lead { background: var(--color-lead); color: #581c87; }

    .btn-icon-only { padding: 8px 10px; border-radius: 12px; }
    .btn-pill { border-radius: 20px; font-weight: 600; }

    /* 메인 뷰어 영역 */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 10px 30px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .sheet-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0,0,0,0.02);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 880px;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      cursor: pointer;
    }

    /* 반전 모드 (무대용) */
    body.invert-mode { background: #000000; }
    body.invert-mode header { background: rgba(28, 28, 30, 0.85); border-bottom-color: #2c2c2e; }
    body.invert-mode select, 
    body.invert-mode button, 
    body.invert-mode input {
      background: #2c2c2e;
      color: #f2f2f7;
      border-color: #3a3a3c;
    }
    body.invert-mode .sheet-card { filter: invert(0.93) hue-rotate(180deg); }

    /* 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(24px);
      width: 92%;
      max-width: 440px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.15);
    }

    .modal h3 { font-size: 17px; font-weight: 700; color: #111827; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-group input { width: 100%; border-radius: 10px; cursor: text; padding: 10px 12px; }

    .pitch-editor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pitch-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8fafc;
      padding: 10px 6px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .pitch-cell span { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
    .pitch-cell input {
      width: 100%;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 2px;
      border-radius: 8px;
      background: #fff;
    }

    .spinner {
      border: 3px solid rgba(0,0,0,0.06);
      border-top: 3px solid var(--accent-blue);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <!-- Row 1: 악보 탐색 및 도구 -->
    <div class="header-row">
      <select id="songSelect">
        <option value="">악보 불러오는 중...</option>
      </select>
      <button class="btn-pill" id="openLinkModalBtn" style="background: #e0e7ff; color: #3730a3;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        링크 추가
      </button>
      <button class="btn-icon-only" id="deleteLocalBtn" style="display:none; color: #ef4444;" title="곡 삭제">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button class="btn-icon-only" id="refreshBtn" title="새로고침">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      </button>
      <button class="btn-icon-only" id="toggleInvert" title="무대용 반전">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10V2z"/></svg>
      </button>
    </div>

    <!-- Row 2: 파트별 첫 음 피치바 & 페이지 넘김 -->
    <div class="header-row" style="justify-content: space-between;">
      <div class="header-row" id="pitchBar" style="width: auto; gap: 6px;"></div>
      
      <div class="header-row" style="width: auto; margin-left: auto; gap: 6px;">
        <button id="openPitchEditorBtn" class="btn-icon-only" title="첫 음 간편 설정" style="background:#f1f5f9;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="prevPage" class="btn-icon-only">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span id="pageIndicator" style="font-size: 12.5px; font-weight: 600; min-width: 44px; text-align: center; color: var(--text-muted);">- / -</span>
        <button id="nextPage" class="btn-icon-only">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- PDF.js Canvas 뷰어 -->
  <main id="viewerMain">
    <div id="statusView" style="margin-top: 100px; text-align: center; color: var(--text-muted);">
      <div class="spinner" id="loadingSpinner"></div>
      <p id="statusText" style="font-size: 14px; font-weight: 500;">설정을 확인하고 있습니다...</p>
    </div>
    <div class="sheet-card" id="sheetCard" style="display: none;">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <!-- 첫 음 퀵 에디터 모달 -->
  <div class="modal-backdrop" id="pitchModal">
    <div class="modal">
      <h3>첫 음 간편 설정</h3>
      <p style="font-size: 12.5px; color: var(--text-muted); margin-top: -6px;">현재 보고 있는 곡의 시작 음을 지정합니다.</p>
      
      <div class="pitch-editor-grid">
        <div class="pitch-cell">
          <span>Soprano</span>
          <input type="text" id="quickS" placeholder="E4" />
        </div>
        <div class="pitch-cell">
          <span>Alto</span>
          <input type="text" id="quickA" placeholder="C4" />
        </div>
        <div class="pitch-cell">
          <span>Tenor</span>
          <input type="text" id="quickT" placeholder="G3" />
        </div>
        <div class="pitch-cell">
          <span>Bass</span>
          <input type="text" id="quickB" placeholder="C3" />
        </div>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button id="closePitchModalBtn">닫기</button>
        <button id="savePitchModalBtn" style="background: var(--accent-blue); color: #fff; border:none; font-weight:600;">저장</button>
      </div>
    </div>
  </div>

  <!-- 링크로 곡 추가 모달 -->
  <div class="modal-backdrop" id="linkModal">
    <div class="modal">
      <h3>새 악보 링크 추가</h3>
      <div class="form-group">
        <label>곡 제목</label>
        <input type="text" id="inputTitle" placeholder="예: Java Jive" required />
      </div>
      <div class="form-group">
        <label>악보 URL (구글 드라이브 공유 링크 또는 웹 PDF)</label>
        <input type="text" id="inputUrl" placeholder="https://drive.google.com/file/d/..." required />
      </div>
      <div class="form-group">
        <label>첫 음 설정 (선택사항)</label>
        <div class="pitch-editor-grid">
          <input type="text" id="noteS" placeholder="S (E4)" />
          <input type="text" id="noteA" placeholder="A (C4)" />
          <input type="text" id="noteT" placeholder="T (G3)" />
          <input type="text" id="noteB" placeholder="B (C3)" />
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button id="closeLinkModalBtn">취소</button>
        <button id="saveLinkSongBtn" style="background: var(--accent-blue); color: #fff; border:none; font-weight:600;">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. 설정 동기화
    // ==========================================
    let GOOGLE_API_KEY = "";
    let DRIVE_FOLDER_ID = "";

    async function loadConfig() {
      try {
        const res = await fetch('./config.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error("config.json 응답 오류");
        const config = await res.json();
        GOOGLE_API_KEY = (config.googleApiKey || config.apiKey || config.GOOGLE_API_KEY || "").trim();
        DRIVE_FOLDER_ID = (config.driveFolderId || config.folderId || config.DRIVE_FOLDER_ID || "").trim();
        console.log("1. config.json 로드 성공!");
      } catch (err) {
        console.warn("config.json 로드 건너뜀 (로컬 곡 모드로 실행):", err.message);
      }
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ==========================================
    // 🗄️ 2. IndexedDB
    // ==========================================
    let db;
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('AcappellaStudioDB_V2', 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('custom_songs')) d.createObjectStore('custom_songs', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('pitch_overrides')) d.createObjectStore('pitch_overrides', { keyPath: 'songId' });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => reject(req.error);
      });
    }

    async function getStored(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function putStored(storeName, item) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteStored(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // ==========================================
    // 🎵 3. 피치 사운드 엔진
    // ==========================================
    let audioCtx = null;
    const noteFrequencies = {
      "C3": 130.81, "C#3": 138.59, "DB3": 138.59, "D3": 146.83, "D#3": 155.56, "EB3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "GB3": 185.00, "G3": 196.00, "G#3": 207.65, "AB3": 207.65, "A3": 220.00, "A#3": 233.08, "BB3": 233.08, "B3": 246.94,
      "C4": 261.63, "C#4": 277.18, "DB4": 277.18, "D4": 293.66, "D#4": 311.13, "EB4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "GB4": 369.99, "G4": 392.00, "G#4": 415.30, "AB4": 415.30, "A4": 440.00, "A#4": 466.16, "BB4": 466.16, "B4": 493.88,
      "C5": 523.25, "C#5": 554.37, "D5": 587.33, "EB5": 622.25, "E5": 659.25
    };

    function playNote(noteName) {
      if (!noteName) return;
      const clean = noteName.trim().toUpperCase();
      const freq = noteFrequencies[clean];
      if (!freq) return;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.8);
    }

    // ==========================================
    // 🔍 4. 파싱 유틸
    // ==========================================
    function extractDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function parseFileName(fileName) {
      const cleanName = fileName.replace(/\.pdf$/i, '');
      const match = cleanName.match(/^(.*?)\s*\[(.*?)\]$/);
      if (!match) return { title: cleanName, notes: {} };

      const title = match[1].trim();
      const notes = {};
      match[2].split(',').forEach(item => {
        const [p, n] = item.split(':');
        if (p && n) notes[p.trim().toUpperCase()] = n.trim().toUpperCase();
      });
      return { title, notes };
    }

    // ==========================================
    // 📂 5. 악보 데이터 로딩 & DOM 요소 참조 (전역 정의)
    // ==========================================
    let allSongs = [];
    let currentSong = null;
    let currentPdfDoc = null;
    let currentPageNum = 1;

    // DOM 요소 전역 선언 (ReferenceError 방지)
    const pdfCanvas = document.getElementById('pdfCanvas');
    const ctx = pdfCanvas ? pdfCanvas.getContext('2d') : null;
    const songSelect = document.getElementById('songSelect');
    const pitchBar = document.getElementById('pitchBar');
    const pageIndicator = document.getElementById('pageIndicator');
    const statusView = document.getElementById('statusView');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('loadingSpinner');
    const sheetCard = document.getElementById('sheetCard');
    const deleteLocalBtn = document.getElementById('deleteLocalBtn');

    async function loadAllSongList(preferredSelectId = null) {
      statusView.style.display = 'block';
      sheetCard.style.display = 'none';
      spinner.style.display = 'block';
      statusText.innerHTML = "악보 목록을 불러오는 중...";

      let driveItems = [];
      if (GOOGLE_API_KEY && DRIVE_FOLDER_ID) {
        try {
          const q = `'${DRIVE_FOLDER_ID}' in parents and mimeType = 'application/pdf' and trashed = false`;
          const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&orderBy=name&key=${GOOGLE_API_KEY}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            driveItems = (data.files || []).map(f => {
              const meta = parseFileName(f.name);
              return { id: `drive_${f.id}`, driveId: f.id, type: 'drive', title: meta.title, notes: meta.notes };
            });
            console.log("2. 드라이브 파일 조회 성공:", driveItems.length, "개");
          } else {
            const errJson = await res.json();
            console.error("드라이브 API 에러:", errJson);
            alert(`[구글 드라이브 API 에러 ${res.status}]\n${errJson.error?.message || ''}`);
          }
        } catch (e) {
          console.warn("구글 드라이브 연동 예외:", e);
        }
      }

      const customItems = await getStored('custom_songs');
      const overrides = await getStored('pitch_overrides');
      const overrideMap = new Map(overrides.map(o => [o.songId, o.notes]));

      allSongs = [...customItems, ...driveItems].map(s => ({
        ...s,
        notes: overrideMap.get(s.id) || s.notes || {}
      }));

      if (allSongs.length === 0) {
        spinner.style.display = 'none';
        statusText.innerHTML = "등록된 악보가 없습니다.<br>상단 [+ 링크 추가] 버튼을 눌러 악보를 추가해 보세요.";
        songSelect.innerHTML = '<option value="">(곡 없음)</option>';
        deleteLocalBtn.style.display = 'none';
        return;
      }

      songSelect.innerHTML = '<option value="">곡을 선택하세요...</option>';
      allSongs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = (s.type === 'custom' ? '🔗 ' : '📁 ') + s.title;
        songSelect.appendChild(opt);
      });

      const targetId = preferredSelectId || allSongs[0].id;
      songSelect.value = targetId;
      loadSong(targetId);
    }

    // PDF.js 기반 다운로드 & 렌더링
    async function loadSong(songId) {
      const song = allSongs.find(s => s.id === songId);
      if (!song) return;
      currentSong = song;

      deleteLocalBtn.style.display = song.type === 'custom' ? 'inline-flex' : 'none';

      // 파스텔 피치 버튼 렌더링
      pitchBar.innerHTML = '';
      const partClassMap = { 'S': 'part-sop', 'A': 'part-alto', 'T': 'part-tenor', 'B': 'part-bass', 'L': 'part-lead' };
      const parts = ['S', 'A', 'T', 'B'];
      let hasAnyPitch = false;

      parts.forEach(p => {
        const note = song.notes?.[p];
        if (note) {
          hasAnyPitch = true;
          const btn = document.createElement('button');
          btn.className = `part-btn ${partClassMap[p] || 'part-lead'}`;
          btn.textContent = `${p} ${note}`;
          btn.onclick = () => playNote(note);
          pitchBar.appendChild(btn);
        }
      });

      if (!hasAnyPitch) {
        const hint = document.createElement('span');
        hint.style.cssText = "font-size: 12px; color: var(--text-muted); padding: 4px 6px;";
        hint.textContent = "첫 음 미설정 (⚙️ 클릭)";
        pitchBar.appendChild(hint);
      }

      // 악보 로딩 시작
      statusView.style.display = 'block';
      sheetCard.style.display = 'none';
      spinner.style.display = 'block';
      statusText.innerHTML = `'${song.title}' 렌더링 중...`;

      let targetUrl = '';
      if (song.type === 'drive') {
        targetUrl = `https://www.googleapis.com/drive/v3/files/${song.driveId}?alt=media&key=${GOOGLE_API_KEY}`;
      } else {
        const driveId = extractDriveFileId(song.url);
        if (driveId && GOOGLE_API_KEY) {
          targetUrl = `https://www.googleapis.com/drive/v3/files/${driveId}?alt=media&key=${GOOGLE_API_KEY}`;
        } else {
          targetUrl = song.url;
        }
      }

      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const arrayBuffer = await res.arrayBuffer();

        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        currentPdfDoc = await loadingTask.promise;

        currentPageNum = 1;
        statusView.style.display = 'none';
        sheetCard.style.display = 'flex';
        renderPage(currentPageNum);
      } catch (err) {
        console.error("PDF.js 로드 실패:", err);
        spinner.style.display = 'none';
        statusText.innerHTML = `악보를 불러올 수 없습니다.<br><small style="color:#ef4444;">(${err.message})<br>구글 드라이브 공유 권한('링크가 있는 모든 사용자-뷰어')을 확인해주세요.</small>`;
      }
    }

    function renderPage(num) {
      if (!currentPdfDoc || !pdfCanvas || !ctx) return;
      currentPdfDoc.getPage(num).then(page => {
        const containerWidth = Math.min(document.getElementById('viewerMain').clientWidth - 20, 880);
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const scale = containerWidth / unscaledViewport.width;
        
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: scale * dpr });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        pdfCanvas.style.width = `${viewport.width / dpr}px`;
        pdfCanvas.style.height = `${viewport.height / dpr}px`;

        page.render({
          canvasContext: ctx,
          viewport: viewport
        });
        pageIndicator.textContent = `${num} / ${currentPdfDoc.numPages}`;
      });
    }

    // ==========================================
    // ⚙️ 6. 모달 동작
    // ==========================================
    const pitchModal = document.getElementById('pitchModal');
    document.getElementById('openPitchEditorBtn').onclick = () => {
      if (!currentSong) return;
      document.getElementById('quickS').value = currentSong.notes?.S || '';
      document.getElementById('quickA').value = currentSong.notes?.A || '';
      document.getElementById('quickT').value = currentSong.notes?.T || '';
      document.getElementById('quickB').value = currentSong.notes?.B || '';
      pitchModal.classList.add('open');
    };
    document.getElementById('closePitchModalBtn').onclick = () => pitchModal.classList.remove('open');

    document.getElementById('savePitchModalBtn').onclick = async () => {
      if (!currentSong) return;
      const newNotes = {
        S: document.getElementById('quickS').value.trim().toUpperCase(),
        A: document.getElementById('quickA').value.trim().toUpperCase(),
        T: document.getElementById('quickT').value.trim().toUpperCase(),
        B: document.getElementById('quickB').value.trim().toUpperCase()
      };

      await putStored('pitch_overrides', { songId: currentSong.id, notes: newNotes });
      currentSong.notes = newNotes;
      pitchModal.classList.remove('open');
      loadSong(currentSong.id);
    };

    const linkModal = document.getElementById('linkModal');
    document.getElementById('openLinkModalBtn').onclick = () => {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputUrl').value = '';
      document.getElementById('noteS').value = '';
      document.getElementById('noteA').value = '';
      document.getElementById('noteT').value = '';
      document.getElementById('noteB').value = '';
      linkModal.classList.add('open');
    };
    document.getElementById('closeLinkModalBtn').onclick = () => linkModal.classList.remove('open');

    document.getElementById('saveLinkSongBtn').onclick = async () => {
      const title = document.getElementById('inputTitle').value.trim();
      const url = document.getElementById('inputUrl').value.trim();
      if (!title || !url) { alert('곡 제목과 악보 URL을 입력해주세요.'); return; }

      const newSong = {
        id: `custom_${Date.now()}`,
        type: 'custom',
        title: title,
        url: url,
        notes: {
          S: document.getElementById('noteS').value.trim().toUpperCase(),
          A: document.getElementById('noteA').value.trim().toUpperCase(),
          T: document.getElementById('noteT').value.trim().toUpperCase(),
          B: document.getElementById('noteB').value.trim().toUpperCase()
        },
        createdAt: Date.now()
      };

      await putStored('custom_songs', newSong);
      linkModal.classList.remove('open');
      await loadAllSongList(newSong.id);
    };

    deleteLocalBtn.onclick = async () => {
      if (!currentSong || currentSong.type !== 'custom') return;
      if (confirm(`'${currentSong.title}' 곡을 삭제하시겠습니까?`)) {
        await deleteStored('custom_songs', currentSong.id);
        await deleteStored('pitch_overrides', currentSong.id);
        await loadAllSongList();
      }
    };

    // ==========================================
    // 🎮 7. 페이지 제어 & 이벤트
    // ==========================================
    function nextPage() {
      if (currentPdfDoc && currentPageNum < currentPdfDoc.numPages) {
        currentPageNum++;
        renderPage(currentPageNum);
      }
    }
    function prevPage() {
      if (currentPdfDoc && currentPageNum > 1) {
        currentPageNum--;
        renderPage(currentPageNum);
      }
    }

    document.getElementById('nextPage').onclick = nextPage;
    document.getElementById('prevPage').onclick = prevPage;
    document.getElementById('refreshBtn').onclick = () => loadAllSongList(currentSong?.id);
    songSelect.onchange = (e) => { if (e.target.value) loadSong(e.target.value); };

    // 안전하게 DOM 객체 존재 여부 체크 후 이벤트 바인딩
    if (pdfCanvas) {
      pdfCanvas.addEventListener('click', (e) => {
        const rect = pdfCanvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        if (clickX > rect.width / 2) nextPage();
        else prevPage();
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) nextPage();
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) prevPage();
    });

    document.getElementById('toggleInvert').onclick = () => {
      document.body.classList.toggle('invert-mode');
    };

    // 앱 진입점
    async function startApp() {
      try {
        await initDB();
        await loadConfig();
        await loadAllSongList();
      } catch (err) {
        console.error("앱 실행 중 오류 발생:", err);
      }
    }

    startApp();
  </script>
</body>
</html>
