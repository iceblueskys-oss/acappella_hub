<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Acappella Studio — Master Suite</title>
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      /* Studio Dark & Metallic Gold Palette */
      --bg-base: #0a0a0c;
      --surface-deep: #121316;
      --surface-elevated: #1a1b20;
      --surface-highlight: #24262d;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-metallic: rgba(212, 175, 55, 0.25);
      
      --text-primary: #f4f4f6;
      --text-secondary: #90939e;
      --text-gold: #d4af37;
      
      /* Part Studio Indicators */
      --color-sop: #e06c75;
      --color-alto: #e5c07b;
      --color-tenor: #98c379;
      --color-bass: #61afef;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Segoe UI", sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 마스터 콘솔 헤더 */
    header {
      background: var(--surface-deep);
      border-bottom: 1px solid var(--border-subtle);
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 100;
      touch-action: auto;
    }

    .console-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .console-row::-webkit-scrollbar { display: none; }

    /* 메탈릭 컨트롤 버튼 & 셀렉트 */
    select, button, input {
      font-family: inherit;
      border: 1px solid var(--border-subtle);
      background: var(--surface-elevated);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
      letter-spacing: -0.01em;
    }
    button:active {
      transform: scale(0.97);
      background: var(--surface-highlight);
    }
    button:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: var(--surface-highlight);
    }

    #songSelect {
      flex: 1;
      min-width: 150px;
      font-weight: 600;
      padding-right: 28px;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%2390939E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* 하이엔드 오디오 파트 배지 */
    .part-btn {
      border: 1px solid var(--border-subtle);
      background: #141519;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.02em;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .part-btn:active {
      transform: scale(0.94);
    }
    .part-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .part-sop .part-indicator { background: var(--color-sop); box-shadow: 0 0 8px var(--color-sop); }
    .part-alto .part-indicator { background: var(--color-alto); box-shadow: 0 0 8px var(--color-alto); }
    .part-tenor .part-indicator { background: var(--color-tenor); box-shadow: 0 0 8px var(--color-tenor); }
    .part-bass .part-indicator { background: var(--color-bass); box-shadow: 0 0 8px var(--color-bass); }

    .btn-gold {
      border-color: var(--border-metallic);
      color: var(--text-gold);
      background: rgba(212, 175, 55, 0.06);
    }
    .btn-gold:hover {
      background: rgba(212, 175, 55, 0.12);
      border-color: rgba(212, 175, 55, 0.4);
    }

    /* 메인 뷰어 영역 */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      position: relative;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      background: #0d0d10;
    }

    .sheet-wrapper {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      cursor: pointer;
    }

    /* 무대용 흑백 반전 모드 */
    body.invert-mode {
      background: #000000;
    }
    body.invert-mode .sheet-wrapper {
      filter: invert(0.92) hue-rotate(180deg) brightness(0.95);
    }

    /* 럭셔리 모달 (Glass & Obsidian) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      touch-action: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #16171c;
      border: 1px solid var(--border-subtle);
      width: 90%;
      max-width: 440px;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .modal h3 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input {
      width: 100%;
      border-radius: 8px;
      cursor: text;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0e0f12;
      color: #fff;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--text-gold);
    }

    /* 첫 음 설정 그리드 */
    .pitch-editor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .pitch-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0e0f12;
      padding: 10px 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }
    .pitch-cell span {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pitch-cell input {
      width: 100%;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 2px;
      border-radius: 6px;
      background: #18191f;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* 로딩 인디케이터 */
    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top: 2px solid var(--text-gold);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <!-- Row 1: 마스터 콘트롤 -->
    <div class="console-row">
      <select id="songSelect">
        <option value="">악보 불러오는 중...</option>
      </select>
      <button class="btn-gold" id="openLinkModalBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        링크 추가
      </button>
      <button id="deleteLocalBtn" style="display:none; color: #ef4444;" title="곡 삭제">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button id="refreshBtn" title="새로고침">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      </button>
      <button id="toggleInvert" title="무대용 반전 모드">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10V2z"/></svg>
      </button>
    </div>

    <!-- Row 2: 파트별 첫 음 모니터 & 페이지 내비게이션 -->
    <div class="console-row" style="justify-content: space-between;">
      <div class="console-row" id="pitchBar" style="width: auto; gap: 6px;"></div>
      
      <div class="console-row" style="width: auto; margin-left: auto; gap: 6px;">
        <button id="openPitchEditorBtn" title="첫 음 간편 설정">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="prevPage">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span id="pageIndicator" style="font-size: 12px; font-weight: 600; min-width: 44px; text-align: center; color: var(--text-secondary); letter-spacing: 0.05em;">- / -</span>
        <button id="nextPage">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- PDF.js Canvas 뷰어 -->
  <main id="viewerMain">
    <div id="statusView" style="margin-top: 120px; text-align: center; color: var(--text-secondary);">
      <div class="spinner" id="loadingSpinner"></div>
      <p id="statusText" style="font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em;">시스템을 초기화하고 있습니다...</p>
    </div>
    <div class="sheet-wrapper" id="sheetCard" style="display: none;">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <!-- 첫 음 퀵 에디터 모달 -->
  <div class="modal-backdrop" id="pitchModal">
    <div class="modal">
      <h3>첫 음 보정</h3>
      <p style="font-size: 12.5px; color: var(--text-secondary); margin-top: -6px;">현재 마스터 악보의 파트별 시작 음을 재정의합니다.</p>
      
      <div class="pitch-editor-grid">
        <div class="pitch-cell">
          <span>Soprano</span>
          <input type="text" id="quickS" placeholder="E4" />
        </div>
        <div class="pitch-cell">
          <span>Alto</span>
          <input type="text" id="quickA" placeholder="C4" />
        </div>
        <div class="pitch-cell">
          <span>Tenor</span>
          <input type="text" id="quickT" placeholder="G3" />
        </div>
        <div class="pitch-cell">
          <span>Bass</span>
          <input type="text" id="quickB" placeholder="C3" />
        </div>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button id="closePitchModalBtn">닫기</button>
        <button class="btn-gold" id="savePitchModalBtn" style="font-weight:600;">저장</button>
      </div>
    </div>
  </div>

  <!-- 링크로 곡 추가 모달 -->
  <div class="modal-backdrop" id="linkModal">
    <div class="modal">
      <h3>악보 링크 등록</h3>
      <div class="form-group">
        <label>곡 명</label>
        <input type="text" id="inputTitle" placeholder="예: Java Jive" required />
      </div>
      <div class="form-group">
        <label>악보 URL (구글 드라이브 공유 링크 또는 PDF)</label>
        <input type="text" id="inputUrl" placeholder="https://drive.google.com/file/d/..." required />
      </div>
      <div class="form-group">
        <label>시작 음 (선택)</label>
        <div class="pitch-editor-grid">
          <input type="text" id="noteS" placeholder="S (E4)" />
          <input type="text" id="noteA" placeholder="A (C4)" />
          <input type="text" id="noteT" placeholder="T (G3)" />
          <input type="text" id="noteB" placeholder="B (C3)" />
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button id="closeLinkModalBtn">취소</button>
        <button class="btn-gold" id="saveLinkSongBtn" style="font-weight:600;">저장</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. 설정 동기화
    // ==========================================
    let GOOGLE_API_KEY = "";
    let DRIVE_FOLDER_ID = "";

    async function loadConfig() {
      try {
        const res = await fetch('./config.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error("config.json 없음");
        const config = await res.json();
        GOOGLE_API_KEY = (config.googleApiKey || config.apiKey || config.GOOGLE_API_KEY || "").trim();
        DRIVE_FOLDER_ID = (config.driveFolderId || config.folderId || config.DRIVE_FOLDER_ID || "").trim();
      } catch (err) {
        console.warn("로컬 모드로 실행:", err.message);
      }
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ==========================================
    // 🗄️ 2. IndexedDB
    // ==========================================
    let db;
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('AcappellaStudioDB_V2', 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('custom_songs')) d.createObjectStore('custom_songs', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('pitch_overrides')) d.createObjectStore('pitch_overrides', { keyPath: 'songId' });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => reject(req.error);
      });
    }

    async function getStored(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function putStored(storeName, item) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteStored(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // ==========================================
    // 🎵 3. 스튜디오 톤 피치 엔진 (맑고 부드러운 하모닉스)
    // ==========================================
    let audioCtx = null;
    const noteFrequencies = {
      "C3": 130.81, "C#3": 138.59, "DB3": 138.59, "D3": 146.83, "D#3": 155.56, "EB3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "GB3": 185.00, "G3": 196.00, "G#3": 207.65, "AB3": 207.65, "A3": 220.00, "A#3": 233.08, "BB3": 233.08, "B3": 246.94,
      "C4": 261.63, "C#4": 277.18, "DB4": 277.18, "D4": 293.66, "D#4": 311.13, "EB4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "GB4": 369.99, "G4": 392.00, "G#4": 415.30, "AB4": 415.30, "A4": 440.00, "A#4": 466.16, "BB4": 466.16, "B4": 493.88,
      "C5": 523.25, "C#5": 554.37, "D5": 587.33, "EB5": 622.25, "E5": 659.25
    };

    function playNote(noteName) {
      if (!noteName) return;
      const clean = noteName.trim().toUpperCase();
      const freq = noteFrequencies[clean];
      if (!freq) return;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.8);
    }

    // ==========================================
    // 🔍 4. 파싱 유틸
    // ==========================================
    function extractDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function parseFileName(fileName) {
      const cleanName = fileName.replace(/\.pdf$/i, '');
      const match = cleanName.match(/^(.*?)\s*\[(.*?)\]$/);
      if (!match) return { title: cleanName, notes: {} };

      const title = match[1].trim();
      const notes = {};
      match[2].split(',').forEach(item => {
        const [p, n] = item.split(':');
        if (p && n) notes[p.trim().toUpperCase()] = n.trim().toUpperCase();
      });
      return { title, notes };
    }

    // ==========================================
    // 📂 5. 악보 데이터 로딩 & 뷰어 렌더링
    // ==========================================
    let allSongs = [];
    let currentSong = null;
    let currentPdfDoc = null;
    let currentPageNum = 1;

    const pdfCanvas = document.getElementById('pdfCanvas');
    const ctx = pdfCanvas ? pdfCanvas.getContext('2d') : null;
    const songSelect = document.getElementById('songSelect');
    const pitchBar = document.getElementById('pitchBar');
    const pageIndicator = document.getElementById('pageIndicator');
    const statusView = document.getElementById('statusView');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('loadingSpinner');
    const sheetCard = document.getElementById('sheetCard');
    const deleteLocalBtn = document.getElementById('deleteLocalBtn');

    async function loadAllSongList(preferredSelectId = null) {
      statusView.style.display = 'block';
      sheetCard.style.display = 'none';
      spinner.style.display = 'block';
      statusText.innerHTML = "트랙 목록을 불러오는 중...";

      let driveItems = [];
      if (GOOGLE_API_KEY && DRIVE_FOLDER_ID) {
        try {
          const q = `'${DRIVE_FOLDER_ID}' in parents and mimeType = 'application/pdf' and trashed = false`;
          const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&orderBy=name&key=${GOOGLE_API_KEY}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            driveItems = (data.files || []).map(f => {
              const meta = parseFileName(f.name);
              return { id: `drive_${f.id}`, driveId: f.id, type: 'drive', title: meta.title, notes: meta.notes };
            });
          }
        } catch (e) {
          console.warn("구글 드라이브 연동 예외:", e);
        }
      }

      const customItems = await getStored('custom_songs');
      const overrides = await getStored('pitch_overrides');
      const overrideMap = new Map(overrides.map(o => [o.songId, o.notes]));

      allSongs = [...customItems, ...driveItems].map(s => ({
        ...s,
        notes: overrideMap.get(s.id) || s.notes || {}
      }));

      if (allSongs.length === 0) {
        spinner.style.display = 'none';
        statusText.innerHTML = "등록된 마스터 악보가 없습니다.<br>상단 [+ 링크 추가]를 통해 곡을 등록하세요.";
        songSelect.innerHTML = '<option value="">(트랙 없음)</option>';
        deleteLocalBtn.style.display = 'none';
        return;
      }

      songSelect.innerHTML = '<option value="">트랙 선택...</option>';
      allSongs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = (s.type === 'custom' ? '◈ ' : '◉ ') + s.title;
        songSelect.appendChild(opt);
      });

      const targetId = preferredSelectId || allSongs[0].id;
      songSelect.value = targetId;
      loadSong(targetId);
    }

    async function loadSong(songId) {
      const song = allSongs.find(s => s.id === songId);
      if (!song) return;
      currentSong = song;

      deleteLocalBtn.style.display = song.type === 'custom' ? 'inline-flex' : 'none';

      // 하이엔드 오디오 배지 렌더링
      pitchBar.innerHTML = '';
      const partClassMap = { 'S': 'part-sop', 'A': 'part-alto', 'T': 'part-tenor', 'B': 'part-bass' };
      const parts = ['S', 'A', 'T', 'B'];
      let hasAnyPitch = false;

      parts.forEach(p => {
        const note = song.notes?.[p];
        if (note) {
          hasAnyPitch = true;
          const btn = document.createElement('button');
          btn.className = `part-btn ${partClassMap[p] || ''}`;
          btn.innerHTML = `<span class="part-indicator"></span>${p} · ${note}`;
          btn.onclick = () => playNote(note);
          pitchBar.appendChild(btn);
        }
      });

      if (!hasAnyPitch) {
        const hint = document.createElement('span');
        hint.style.cssText = "font-size: 11.5px; color: var(--text-secondary); padding: 4px 6px; letter-spacing: -0.01em;";
        hint.textContent = "첫 음 미지정 (우측 ⚙ 아이콘)";
        pitchBar.appendChild(hint);
      }

      // 악보 렌더링
      statusView.style.display = 'block';
      sheetCard.style.display = 'none';
      spinner.style.display = 'block';
      statusText.innerHTML = `'${song.title}' 렌더링 중...`;

      let targetUrl = '';
      if (song.type === 'drive') {
        targetUrl = `https://www.googleapis.com/drive/v3/files/${song.driveId}?alt=media&key=${GOOGLE_API_KEY}`;
      } else {
        const driveId = extractDriveFileId(song.url);
        if (driveId && GOOGLE_API_KEY) {
          targetUrl = `https://www.googleapis.com/drive/v3/files/${driveId}?alt=media&key=${GOOGLE_API_KEY}`;
        } else {
          targetUrl = song.url;
        }
      }

      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const arrayBuffer = await res.arrayBuffer();

        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        currentPdfDoc = await loadingTask.promise;

        currentPageNum = 1;
        statusView.style.display = 'none';
        sheetCard.style.display = 'flex';
        renderPage(currentPageNum);
      } catch (err) {
        console.error("PDF 로드 실패:", err);
        spinner.style.display = 'none';
        statusText.innerHTML = `악보를 불러올 수 없습니다.<br><small style="color:#ef4444;">(${err.message})<br>공유 권한('링크가 있는 모든 사용자-뷰어')을 확인해주세요.</small>`;
      }
    }

    function renderPage(num) {
      if (!currentPdfDoc || !pdfCanvas || !ctx) return;
      currentPdfDoc.getPage(num).then(page => {
        const viewerWidth = document.getElementById('viewerMain').clientWidth;
        const targetWidth = Math.min(viewerWidth, 900);

        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const scale = targetWidth / unscaledViewport.width;
        
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: scale * dpr });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        pdfCanvas.style.width = `${targetWidth}px`;
        pdfCanvas.style.height = `${(viewport.height / dpr)}px`;

        page.render({
          canvasContext: ctx,
          viewport: viewport
        });
        pageIndicator.textContent = `${num} / ${currentPdfDoc.numPages}`;
        document.getElementById('viewerMain').scrollTop = 0;
      });
    }

    window.addEventListener('resize', () => {
      if (currentPdfDoc) renderPage(currentPageNum);
    });

    // ==========================================
    // ⚙️ 6. 모달 제어
    // ==========================================
    const pitchModal = document.getElementById('pitchModal');
    document.getElementById('openPitchEditorBtn').onclick = () => {
      if (!currentSong) return;
      document.getElementById('quickS').value = currentSong.notes?.S || '';
      document.getElementById('quickA').value = currentSong.notes?.A || '';
      document.getElementById('quickT').value = currentSong.notes?.T || '';
      document.getElementById('quickB').value = currentSong.notes?.B || '';
      pitchModal.classList.add('open');
    };
    document.getElementById('closePitchModalBtn').onclick = () => pitchModal.classList.remove('open');

    document.getElementById('savePitchModalBtn').onclick = async () => {
      if (!currentSong) return;
      const newNotes = {
        S: document.getElementById('quickS').value.trim().toUpperCase(),
        A: document.getElementById('quickA').value.trim().toUpperCase(),
        T: document.getElementById('quickT').value.trim().toUpperCase(),
        B: document.getElementById('quickB').value.trim().toUpperCase()
      };

      await putStored('pitch_overrides', { songId: currentSong.id, notes: newNotes });
      currentSong.notes = newNotes;
      pitchModal.classList.remove('open');
      loadSong(currentSong.id);
    };

    const linkModal = document.getElementById('linkModal');
    document.getElementById('openLinkModalBtn').onclick = () => {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputUrl').value = '';
      document.getElementById('noteS').value = '';
      document.getElementById('noteA').value = '';
      document.getElementById('noteT').value = '';
      document.getElementById('noteB').value = '';
      linkModal.classList.add('open');
    };
    document.getElementById('closeLinkModalBtn').onclick = () => linkModal.classList.remove('open');

    document.getElementById('saveLinkSongBtn').onclick = async () => {
      const title = document.getElementById('inputTitle').value.trim();
      const url = document.getElementById('inputUrl').value.trim();
      if (!title || !url) { alert('곡 명과 악보 URL을 입력해주세요.'); return; }

      const newSong = {
        id: `custom_${Date.now()}`,
        type: 'custom',
        title: title,
        url: url,
        notes: {
          S: document.getElementById('noteS').value.trim().toUpperCase(),
          A: document.getElementById('noteA').value.trim().toUpperCase(),
          T: document.getElementById('noteT').value.trim().toUpperCase(),
          B: document.getElementById('noteB').value.trim().toUpperCase()
        },
        createdAt: Date.now()
      };

      await putStored('custom_songs', newSong);
      linkModal.classList.remove('open');
      await loadAllSongList(newSong.id);
    };

    deleteLocalBtn.onclick = async () => {
      if (!currentSong || currentSong.type !== 'custom') return;
      if (confirm(`'${currentSong.title}' 트랙을 삭제하시겠습니까?`)) {
        await deleteStored('custom_songs', currentSong.id);
        await deleteStored('pitch_overrides', currentSong.id);
        await loadAllSongList();
      }
    };

    // ==========================================
    // 🎮 7. 페이지 제어 & 넘김
    // ==========================================
    function nextPage() {
      if (currentPdfDoc && currentPageNum < currentPdfDoc.numPages) {
        currentPageNum++;
        renderPage(currentPageNum);
      }
    }
    function prevPage() {
      if (currentPdfDoc && currentPageNum > 1) {
        currentPageNum--;
        renderPage(currentPageNum);
      }
    }

    document.getElementById('nextPage').onclick = nextPage;
    document.getElementById('prevPage').onclick = prevPage;
    document.getElementById('refreshBtn').onclick = () => loadAllSongList(currentSong?.id);
    songSelect.onchange = (e) => { if (e.target.value) loadSong(e.target.value); };

    if (pdfCanvas) {
      pdfCanvas.addEventListener('click', (e) => {
        const rect = pdfCanvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        if (clickX > rect.width / 2) nextPage();
        else prevPage();
      });
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) nextPage();
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) prevPage();
    });

    document.getElementById('toggleInvert').onclick = () => {
      document.body.classList.toggle('invert-mode');
    };

    // 앱 초기화
    async function startApp() {
      try {
        await initDB();
        await loadConfig();
        await loadAllSongList();
      } catch (err) {
        console.error("오류 발생:", err);
      }
    }

    startApp();
  </script>
</body>
</html>
