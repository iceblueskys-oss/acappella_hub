<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Acappella Studio — Master Suite</title>
  
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Acappella" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='gold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23F6E09E'/%3E%3Cstop offset='50%25' stop-color='%23D4AF37'/%3E%3Cstop offset='100%25' stop-color='%238A6F1D'/%3E%3C/linearGradient%3E%3CradialGradient id='bg' cx='50%25' cy='50%25' r='50%25'%3E%3Cstop offset='0%25' stop-color='%231B1C22'/%3E%3Cstop offset='100%25' stop-color='%2308090C'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23bg)' stroke='rgba(255,255,255,0.1)' stroke-width='1.5'/%3E%3Cpath d='M25 15v18a7 7 0 0 0 14 0V15' fill='none' stroke='url(%23gold)' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M32 39v12' fill='none' stroke='url(%23gold)' stroke-width='3.8' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='53' r='2.8' fill='url(%23gold)'/%3E%3Ccircle cx='17' cy='23' r='1.8' fill='%23E06C75'/%3E%3Ccircle cx='47' cy='23' r='1.8' fill='%2361AFEF'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-base: #07080a;
      --surface-deep: #0f1015;
      --surface-elevated: #161820;
      --surface-highlight: #1f222d;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-metallic: rgba(212, 175, 55, 0.4);
      
      --text-primary: #f6f7fa;
      --text-secondary: #888d9e;
      --text-gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.25);
      
      --sop-accent: #f87171;
      --alto-accent: #fbbf24;
      --tenor-accent: #34d399;
      --bass-accent: #60a5fa;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Segoe UI", sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* 상단 콘솔 헤더 (모바일 컴팩트 패딩 적용) */
    header {
      background: var(--surface-deep);
      border-bottom: 1px solid var(--border-subtle);
      padding: calc(env(safe-area-inset-top, 0px) + 6px) 10px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 100;
      touch-action: auto;
    }

    .console-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .scroll-row {
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-row::-webkit-scrollbar { display: none; }

    select, button, input {
      font-family: inherit;
      border: 1px solid var(--border-subtle);
      background: var(--surface-elevated);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    button:active { transform: scale(0.96); background: var(--surface-highlight); }
    button:hover { border-color: rgba(255, 255, 255, 0.2); background: var(--surface-highlight); }
    button.active {
      background: var(--text-gold) !important;
      color: #060709 !important;
      border-color: var(--text-gold) !important;
      font-weight: 700;
    }

    #songSelect {
      flex: 1;
      min-width: 120px;
      font-weight: 600;
      padding-right: 22px;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23888D9E' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 8px center;
      border-color: rgba(255, 255, 255, 0.12);
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .btn-gold {
      border-color: var(--border-metallic);
      color: var(--text-gold);
      background: rgba(212, 175, 55, 0.08);
    }

    .compact-group {
      display: inline-flex;
      align-items: center;
      background: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 1px 3px;
      gap: 2px;
    }
    .compact-group button { border: none; background: transparent; padding: 4px 6px; }
    .compact-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); min-width: 32px; text-align: center; }

    /* 피치 캡슐 버튼 */
    .pitch-capsule {
      display: inline-flex;
      align-items: center;
      background: #0d0e13;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      padding: 2px 7px 2px 3px;
      gap: 5px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
    }
    .pitch-capsule:active {
      transform: scale(0.95);
      border-color: var(--text-gold);
      box-shadow: 0 0 10px var(--gold-glow);
    }
    .pitch-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .pitch-capsule.sop .pitch-badge { background: rgba(248, 113, 113, 0.15); color: var(--sop-accent); border: 1px solid rgba(248, 113, 113, 0.3); }
    .pitch-capsule.alto .pitch-badge { background: rgba(251, 191, 36, 0.15); color: var(--alto-accent); border: 1px solid rgba(251, 191, 36, 0.3); }
    .pitch-capsule.tenor .pitch-badge { background: rgba(52, 211, 153, 0.15); color: var(--tenor-accent); border: 1px solid rgba(52, 211, 153, 0.3); }
    .pitch-capsule.bass .pitch-badge { background: rgba(96, 165, 250, 0.15); color: var(--bass-accent); border: 1px solid rgba(96, 165, 250, 0.3); }
    .pitch-val { font-size: 11.5px; font-weight: 700; color: #e5e7eb; }

    .metro-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2a2c35;
      display: inline-block;
      transition: background 0.05s ease, box-shadow 0.05s ease;
    }
    .metro-led.flash { background: var(--text-gold); box-shadow: 0 0 8px var(--text-gold); }

    /* 하단 오디오 바 */
    #audioBar {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 15, 20, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px 12px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 150;
      box-shadow: 0 12px 40px rgba(0,0,0,0.85);
      max-width: 95%;
    }
    #audioBar.show { display: flex; }

    .part-track-selector {
      display: flex;
      background: #08090c;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-subtle);
      gap: 2px;
    }
    .part-tab {
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .part-tab.has-audio { color: #d1d5db; }
    .part-tab.active {
      background: var(--surface-highlight);
      color: var(--text-gold);
    }

    /* 메인 뷰어 */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 85px);
      position: relative;
      touch-action: pan-y pinch-zoom;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      background: #090a0d;
    }

    .sheet-wrapper {
      position: relative;
      background: #ffffff;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    #pdfCanvas { display: block; }
    #drawCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
      touch-action: none;
      display: none;
    }
    #drawCanvas.active { display: block; }

    body.invert-mode { background: #000000; }
    body.invert-mode .sheet-wrapper { filter: invert(0.92) hue-rotate(180deg) brightness(0.95); }

    /* 모달 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      touch-action: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #14161d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 92%;
      max-width: 440px;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
    }
    .modal h3 { font-size: 15px; font-weight: 700; color: #ffffff; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
    .form-group input[type="text"] {
      width: 100%;
      border-radius: 7px;
      cursor: text;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #0b0c10;
      color: #fff;
    }

    .pitch-slot-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .pitch-edit-card {
      background: #0c0d12;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .pitch-edit-card span { font-size: 10px; font-weight: 800; }
    .pitch-edit-card select {
      width: 100%;
      padding: 5px 2px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 6px;
      background: #1a1c24;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .audio-upload-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0b0c10;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .audio-upload-row span { font-size: 11px; font-weight: 700; width: 34px; color: var(--text-gold); }
    .audio-upload-row input[type="file"] { display: none; }
    .audio-upload-row .upload-btn { font-size: 11px; padding: 4px 8px; border-radius: 5px; background: #1b1d26; }
    .audio-upload-row .status-text {
      font-size: 11px;
      color: var(--text-secondary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spinner {
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top: 2px solid var(--text-gold);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <!-- Row 1: 악보 선택 + 핵심 액션 버튼 (모바일에서도 항상 보이는 메인 열) -->
    <div class="console-row">
      <select id="songSelect">
        <option value="">악보 불러오는 중...</option>
      </select>
      
      <button class="btn-gold" id="openLinkModalBtn" title="악보 및 파트 음원 등록">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>곡 추가</span>
      </button>

      <button id="drawToggleBtn" title="개인 메모 펜/숨표">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        <span>메모</span>
      </button>

      <button id="toggleInvert" title="무대용 반전">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10 10 10 0 0 1-10 10V2z"/></svg>
      </button>

      <button id="deleteLocalBtn" style="display:none; color: #ef4444;" title="곡 삭제">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>
    </div>

    <!-- Row 2: 줌 컨트롤 + 메트로놈 + 음정 에디터 + 새로고침 -->
    <div class="console-row" style="justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <div class="compact-group">
          <button id="zoomOutBtn" title="축소">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          </button>
          <span class="compact-label" id="zoomLevelText">100%</span>
          <button id="zoomInBtn" title="확대">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>

        <button id="metroToggleBtn" title="메트로놈 켜기/끄기">
          <span class="metro-led" id="metroLed"></span>
          <span id="metroBpmLabel" style="font-size: 11px;">100 BPM</span>
        </button>
        
        <button id="openMetroModalBtn" title="템포 설정">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px;">
        <button id="openPitchEditorBtn" title="파트 첫 음 설정">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span>음정</span>
        </button>
        <button id="refreshBtn" title="새로고침">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        </button>
      </div>
    </div>

    <!-- Row 3: 파트별 첫 음 피치 캡슐 + 페이지 내비게이션 -->
    <div class="console-row" id="normalToolbar" style="justify-content: space-between;">
      <div class="console-row scroll-row" id="pitchBar" style="width: auto; gap: 5px;"></div>
      
      <div style="display: flex; align-items: center; margin-left: auto; gap: 4px; flex-shrink: 0;">
        <button id="prevPage">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span id="pageIndicator" style="font-size: 11px; font-weight: 600; min-width: 38px; text-align: center; color: var(--text-secondary); letter-spacing: 0.05em;">- / -</span>
        <button id="nextPage">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- 드로잉 모드 툴바 -->
    <div class="console-row scroll-row" id="drawingToolbar" style="display: none; gap: 6px;">
      <button class="active" id="toolPenBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        <span>펜</span>
      </button>
      <button id="toolBreathBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        <span>숨표(V)</span>
      </button>
      <button id="toolHighlighterBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 11-6 6v3h3l6-6"/><path d="m22 2-2.5 2.5a2.12 2.12 0 0 1-3 0l-.5-.5a2.12 2.12 0 0 1 0-3L18.5 0z"/></svg>
        <span>형광펜</span>
      </button>
      <button id="toolEraserBtn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/></svg>
        <span>지우개</span>
      </button>
      <button id="clearDrawBtn" style="color: #ef4444;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        <span>초기화</span>
      </button>
    </div>
  </header>

  <!-- 메인 악보 뷰어 & 독립 메모 캔버스 -->
  <main id="viewerMain">
    <div id="statusView" style="margin-top: 120px; text-align: center; color: var(--text-secondary);">
      <div class="spinner" id="loadingSpinner"></div>
      <p id="statusText" style="font-size: 13.5px; font-weight: 500;">시스템을 초기화하고 있습니다...</p>
    </div>
    <div class="sheet-wrapper" id="sheetCard" style="display: none;">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
  </main>

  <!-- 하단 파트별 오디오 콘솔 플레이어 -->
  <div id="audioBar">
    <button id="audioPlayBtn" style="border-radius: 50%; width: 30px; height: 30px; padding: 0; justify-content: center; background: #222530;">
      <svg id="playIconSvg" width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
    </button>
    
    <div class="part-track-selector" id="partTabSelector">
      <button class="part-tab active" data-part="ALL">ALL</button>
      <button class="part-tab" data-part="S">S</button>
      <button class="part-tab" data-part="A">A</button>
      <button class="part-tab" data-part="T">T</button>
      <button class="part-tab" data-part="B">B</button>

    <span id="audioTimeText" style="font-size: 10px; color: var(--text-secondary); min-width: 26px; text-align: center;">0:00</span>
    <button id="audioRateBtn" style="font-size: 10px; padding: 2px 5px;">1.0x</button>
    
    <button id="closeAudioBtn" style="border: none; background: transparent; padding: 4px; color: var(--text-secondary);">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <audio id="guideAudioElement" preload="none"></audio>
  </div>

  <!-- 메트로놈 설정 모달 -->
  <div class="modal-backdrop" id="metroModal">
    <div class="modal">
      <h3>메트로놈 설정</h3>
      <div class="form-group">
        <label>템포: <span id="modalBpmDisplay" style="color: var(--text-gold); font-size: 13px;">100 BPM</span></label>
        <input type="range" id="bpmSlider" min="40" max="220" value="100" style="padding: 0; cursor: pointer;" />
      </div>
      <div style="display: flex; gap: 8px;">
        <button id="tapTempoBtn" class="btn-gold" style="flex: 1; justify-content: center; padding: 10px;">TAP TEMPO</button>
        <button id="metroSoundToggleBtn" style="flex: 1; justify-content: center;">오디오: 켜짐</button>
      </div>
      <div style="display: flex; justify-content: flex-end; margin-top: 6px;">
        <button id="closeMetroModalBtn">닫기</button>
      </div>
    </div>
  </div>

  <!-- 파트별 첫 음 지정 모달 -->
  <div class="modal-backdrop" id="pitchModal">
    <div class="modal">
      <h3>파트별 첫 음 지정</h3>
      <div class="pitch-slot-container">
        <div class="pitch-edit-card">
          <span style="color: var(--sop-accent);">SOP</span>
          <select id="quickS_select"></select>
        </div>
        <div class="pitch-edit-card">
          <span style="color: var(--alto-accent);">ALT</span>
          <select id="quickA_select"></select>
        </div>
        <div class="pitch-edit-card">
          <span style="color: var(--tenor-accent);">TEN</span>
          <select id="quickT_select"></select>
        </div>
        <div class="pitch-edit-card">
          <span style="color: var(--bass-accent);">BAS</span>
          <select id="quickB_select"></select>
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
        <button id="closePitchModalBtn">닫기</button>
        <button class="btn-gold" id="savePitchModalBtn" style="font-weight:600;">저장</button>
      </div>
    </div>
  </div>

  <!-- 악보 및 파트별 음원 등록 모달 -->
  <div class="modal-backdrop" id="linkModal">
    <div class="modal" style="max-height: 85vh; overflow-y: auto;">
      <h3>악보 및 파트별 음원 등록</h3>
      <div class="form-group">
        <label>곡 명</label>
        <input type="text" id="inputTitle" placeholder="예: Java Jive" required />
      </div>
      <div class="form-group">
        <label>악보 PDF URL (구글 드라이브 링크)</label>
        <input type="text" id="inputUrl" placeholder="https://drive.google.com/file/d/..." required />
      </div>

      <div class="form-group" style="gap: 6px;">
        <label>파트별 음원 등록 (카톡에서 저장한 MP3 파일 선택)</label>
        
        <div class="audio-upload-row">
          <span>ALL</span>
          <button class="upload-btn" onclick="document.getElementById('audioFile_ALL').click()">파일 선택</button>
          <input type="file" id="audioFile_ALL" accept="audio/*" onchange="handleAudioUpload('ALL', this)" />
          <span class="status-text" id="status_ALL">미등록</span>
        </div>

        <div class="audio-upload-row">
          <span style="color: var(--sop-accent);">SOP</span>
          <button class="upload-btn" onclick="document.getElementById('audioFile_S').click()">파일 선택</button>
          <input type="file" id="audioFile_S" accept="audio/*" onchange="handleAudioUpload('S', this)" />
          <span class="status-text" id="status_S">미등록</span>
        </div>

        <div class="audio-upload-row">
          <span style="color: var(--alto-accent);">ALT</span>
          <button class="upload-btn" onclick="document.getElementById('audioFile_A').click()">파일 선택</button>
          <input type="file" id="audioFile_A" accept="audio/*" onchange="handleAudioUpload('A', this)" />
          <span class="status-text" id="status_A">미등록</span>
        </div>

        <div class="audio-upload-row">
          <span style="color: var(--tenor-accent);">TEN</span>
          <button class="upload-btn" onclick="document.getElementById('audioFile_T').click()">파일 선택</button>
          <input type="file" id="audioFile_T" accept="audio/*" onchange="handleAudioUpload('T', this)" />
          <span class="status-text" id="status_T">미등록</span>
        </div>

        <div class="audio-upload-row">
          <span style="color: var(--bass-accent);">BAS</span>
          <button class="upload-btn" onclick="document.getElementById('audioFile_B').click()">파일 선택</button>
          <input type="file" id="audioFile_B" accept="audio/*" onchange="handleAudioUpload('B', this)" />
          <span class="status-text" id="status_B">미등록</span>
        </div>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
        <button id="closeLinkModalBtn">취소</button>
        <button class="btn-gold" id="saveLinkSongBtn" style="font-weight:600;">저장</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. 설정 및 초기화
    // ==========================================
    let GOOGLE_API_KEY = "";
    let DRIVE_FOLDER_ID = "";

    async function loadConfig() {
      try {
        const res = await fetch('./config.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error("config.json 없음");
        const config = await res.json();
        GOOGLE_API_KEY = (config.googleApiKey || config.apiKey || config.GOOGLE_API_KEY || "").trim();
        DRIVE_FOLDER_ID = (config.driveFolderId || config.folderId || config.DRIVE_FOLDER_ID || "").trim();
      } catch (err) {
        console.warn("로컬 모드로 실행:", err.message);
      }
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // ==========================================
    // 🗄️ 2. IndexedDB
    // ==========================================
    let db;
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('AcappellaStudioDB_V5', 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('custom_songs')) d.createObjectStore('custom_songs', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('pitch_overrides')) d.createObjectStore('pitch_overrides', { keyPath: 'songId' });
          if (!d.objectStoreNames.contains('personal_drawings')) d.createObjectStore('personal_drawings', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('part_audios')) d.createObjectStore('part_audios', { keyPath: 'id' });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => reject(req.error);
      });
    }

    async function getStored(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    async function getStoredItem(storeName, key) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).get(key);
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function putStored(storeName, item) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteStored(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // ==========================================
    // 🎵 3. 오디오 & 피치 엔진 (아이폰 사파리 락 해제 포함)
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function unlockIOSAudio() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();
      const buffer = ctx.createBuffer(1, 1, 22050);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.start(0);

      window.removeEventListener('touchstart', unlockIOSAudio);
      window.removeEventListener('click', unlockIOSAudio);
    }
    window.addEventListener('touchstart', unlockIOSAudio, { passive: true });
    window.addEventListener('click', unlockIOSAudio, { passive: true });

    const availableNotes = [
      "", "C3", "C#3", "D3", "Eb3", "E3", "F3", "F#3", "G3", "Ab3", "A3", "Bb3", "B3",
      "C4", "C#4", "D4", "Eb4", "E4", "F4", "F#4", "G4", "Ab4", "A4", "Bb4", "B4",
      "C5", "C#5", "D5", "Eb5", "E5"
    ];

    const noteFrequencies = {
      "C3": 130.81, "C#3": 138.59, "DB3": 138.59, "D3": 146.83, "D#3": 155.56, "EB3": 155.56, "E3": 164.81, "F3": 174.61, "F#3": 185.00, "GB3": 185.00, "G3": 196.00, "G#3": 207.65, "AB3": 207.65, "A3": 220.00, "A#3": 233.08, "BB3": 233.08, "B3": 246.94,
      "C4": 261.63, "C#4": 277.18, "DB4": 277.18, "D4": 293.66, "D#4": 311.13, "EB4": 311.13, "E4": 329.63, "F4": 349.23, "F#4": 369.99, "GB4": 369.99, "G4": 392.00, "G#4": 415.30, "AB4": 415.30, "A4": 440.00, "A#4": 466.16, "BB4": 466.16, "B4": 493.88,
      "C5": 523.25, "C#5": 554.37, "D5": 587.33, "EB5": 622.25, "E5": 659.25
    };

    function playNote(noteName) {
      if (!noteName) return;
      const clean = noteName.trim().toUpperCase();
      const freq = noteFrequencies[clean];
      if (!freq) return;

      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);

      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 1.8);
    }

    function initPitchSelectOptions() {
      ['quickS_select', 'quickA_select', 'quickT_select', 'quickB_select'].forEach(id => {
        const sel = document.getElementById(id);
        sel.innerHTML = '';
        availableNotes.forEach(n => {
          const opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n || '(미설정)';
          sel.appendChild(opt);
        });
      });
    }

    // 메트로놈
    let metroBpm = 100;
    let isMetroRunning = false;
    let isMetroSoundOn = true;
    let metroTimerId = null;

    function playMetroClick() {
      if (!isMetroSoundOn) return;
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1000, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
    }

    const metroLed = document.getElementById('metroLed');
    function metroTick() {
      metroLed.classList.add('flash');
      setTimeout(() => metroLed.classList.remove('flash'), 80);
      playMetroClick();
    }

    function startMetro() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') ctx.resume();

      isMetroRunning = true;
      document.getElementById('metroToggleBtn').classList.add('active');
      const interval = (60 / metroBpm) * 1000;
      metroTick();
      metroTimerId = setInterval(metroTick, interval);
    }

    function stopMetro() {
      isMetroRunning = false;
      document.getElementById('metroToggleBtn').classList.remove('active');
      if (metroTimerId) clearInterval(metroTimerId);
      metroLed.classList.remove('flash');
    }

    document.getElementById('metroToggleBtn').onclick = () => {
      if (isMetroRunning) stopMetro();
      else startMetro();
    };

    let tapTimes = [];
    document.getElementById('tapTempoBtn').onclick = () => {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length >= 2) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i - 1]);
        const avg = intervals.reduce((a, b) => a + b) / intervals.length;
        const calcBpm = Math.round(60000 / avg);
        if (calcBpm >= 40 && calcBpm <= 240) {
          metroBpm = calcBpm;
          document.getElementById('bpmSlider').value = calcBpm;
          document.getElementById('modalBpmDisplay').textContent = `${calcBpm} BPM`;
          document.getElementById('metroBpmLabel').textContent = `${calcBpm} BPM`;
          if (isMetroRunning) { stopMetro(); startMetro(); }
        }
      }
    };

    document.getElementById('bpmSlider').oninput = (e) => {
      metroBpm = Number(e.target.value);
      document.getElementById('modalBpmDisplay').textContent = `${metroBpm} BPM`;
      document.getElementById('metroBpmLabel').textContent = `${metroBpm} BPM`;
      if (isMetroRunning) { stopMetro(); startMetro(); }
    };

    document.getElementById('metroSoundToggleBtn').onclick = (e) => {
      isMetroSoundOn = !isMetroSoundOn;
      e.target.textContent = `오디오: ${isMetroSoundOn ? '켜짐' : '무음'}`;
    };

    // ==========================================
    // 🔍 4. 파싱 유틸
    // ==========================================
    function extractDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function parseFileName(fileName) {
      const cleanName = fileName.replace(/\.pdf$/i, '');
      const match = cleanName.match(/^(.*?)\s*\[(.*?)\]$/);
      if (!match) return { title: cleanName, notes: {} };

      const title = match[1].trim();
      const notes = {};
      match[2].split(',').forEach(item => {
        const [p, n] = item.split(':');
        if (p && n) notes[p.trim().toUpperCase()] = n.trim().toUpperCase();
      });
      return { title, notes };
    }

    // ==========================================
    // 📂 5. 악보 데이터 로딩 & 렌더링
    // ==========================================
    let allSongs = [];
    let currentSong = null;
    let currentPdfDoc = null;
    let currentPageNum = 1;
    let zoomScale = 1.0;

    const pdfCanvas = document.getElementById('pdfCanvas');
    const pdfCtx = pdfCanvas ? pdfCanvas.getContext('2d') : null;
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas ? drawCanvas.getContext('2d') : null;

    const songSelect = document.getElementById('songSelect');
    const pitchBar = document.getElementById('pitchBar');
    const pageIndicator = document.getElementById('pageIndicator');
    const statusView = document.getElementById('statusView');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('loadingSpinner');
    const sheetCard = document.getElementById('sheetCard');
    const deleteLocalBtn = document.getElementById('deleteLocalBtn');
    const zoomLevelText = document.getElementById('zoomLevelText');

    async function loadAllSongList(preferredSelectId = null) {
      statusView.style.display = 'block';
      sheetCard.style.display = 'none';
      spinner.style.display = 'block';
      statusText.innerHTML = "트랙 목록을 불러오는 중...";

      let driveItems = [];
      if (GOOGLE_API_KEY && DRIVE_FOLDER_ID) {
        try {
          const q = `'${DRIVE_FOLDER_ID}' in parents and mimeType = 'application/pdf' and trashed = false`;
          const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&orderBy=name&key=${GOOGLE_API_KEY}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            driveItems = (data.files || []).map(f => {
              const meta = parseFileName(f.name);
              return { id: `drive_${f.id}`, driveId: f.id, type: 'drive', title: meta.title, notes: meta.notes };
            });
          }
        } catch (e) {
          console.warn("구글 드라이브 연동 예외:", e);
        }
      }

      const customItems = await getStored('custom_songs');
      const overrides = await getStored('pitch_overrides');
      const overrideMap = new Map(overrides.map(o => [o.songId, o.notes]));

      allSongs = [...customItems, ...driveItems].map(s => ({
        ...s,
        notes: overrideMap.get(s.id) || s.notes || {}
      }));

      if (allSongs.length === 0) {
        spinner.style.display = 'none';
        statusText.innerHTML = "등록된 마스터 악보가 없습니다.<br>상단 [+ 곡 추가] 버튼을 눌러보세요.";
        songSelect.innerHTML = '<option value="">(트랙 없음)</option>';
        deleteLocalBtn.style.display = 'none';
        return;
      }

      songSelect.innerHTML = '<option value="">트랙 선택...</option>';
      allSongs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = (s.type === 'custom' ? '◈ ' : '◉ ') + s.title;
        songSelect.appendChild(opt);
      });

      const targetId = preferredSelectId || allSongs[0].id;
      songSelect.value = targetId;
      loadSong(targetId);
    }

    async function loadSong(songId) {
      const song = allSongs.find(s => s.id === songId);
      if (!song) return;
      currentSong = song;

      deleteLocalBtn.style.display = song.type === 'custom' ? 'inline-flex' : 'none';
      await loadSongAudioTracks(song);

      pitchBar.innerHTML = '';
      const partClassMap = { 'S': 'sop', 'A': 'alto', 'T': 'tenor', 'B': 'bass' };
      const partFullMap = { 'S': 'SOP', 'A': 'ALT', 'T': 'TEN', 'B': 'BAS' };
      const parts = ['S', 'A', 'T', 'B'];
      let hasAnyPitch = false;

      parts.forEach(p => {
        const note = song.notes?.[p];
        if (note) {
          hasAnyPitch = true;
          const btn = document.createElement('button');
          btn.className = `pitch-capsule ${partClassMap[p] || ''}`;
          btn.innerHTML = `
            <span class="pitch-badge">${partFullMap[p]}</span>
            <span class="pitch-val">${note}</span>
          `;
          btn.onclick = () => playNote(note);
          pitchBar.appendChild(btn);
        }
      });

      if (!hasAnyPitch) {
        const hint = document.createElement('span');
        hint.style.cssText = "font-size: 11px; color: var(--text-secondary); padding: 4px 6px;";
        hint.textContent = "첫 음 미지정 (음정 버튼)";
        pitchBar.appendChild(hint);
      }

      statusView.style.display = 'block';
      sheetCard.style.display = 'none';
      spinner.style.display = 'block';
      statusText.innerHTML = `'${song.title}' 렌더링 중...`;

      let targetUrl = '';
      if (song.type === 'drive') {
        targetUrl = `https://www.googleapis.com/drive/v3/files/${song.driveId}?alt=media&key=${GOOGLE_API_KEY}`;
      } else {
        const driveId = extractDriveFileId(song.url);
        if (driveId && GOOGLE_API_KEY) {
          targetUrl = `https://www.googleapis.com/drive/v3/files/${driveId}?alt=media&key=${GOOGLE_API_KEY}`;
        } else {
          targetUrl = song.url;
        }
      }

      try {
        const res = await fetch(targetUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const arrayBuffer = await res.arrayBuffer();

        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        currentPdfDoc = await loadingTask.promise;

        currentPageNum = 1;
        zoomScale = 1.0;
        updateZoomDisplay();
        statusView.style.display = 'none';
        sheetCard.style.display = 'flex';
        renderPage(currentPageNum);
      } catch (err) {
        console.error("PDF 로드 실패:", err);
        spinner.style.display = 'none';
        statusText.innerHTML = `악보를 불러올 수 없습니다.<br><small style="color:#ef4444;">(${err.message})<br>공유 권한을 확인해주세요.</small>`;
      }
    }

    function renderPage(num) {
      if (!currentPdfDoc || !pdfCanvas || !pdfCtx) return;
      currentPdfDoc.getPage(num).then(page => {
        const viewerWidth = document.getElementById('viewerMain').clientWidth;
        const baseWidth = Math.min(viewerWidth, 900);
        const targetWidth = baseWidth * zoomScale;

        const unscaledViewport = page.getViewport({ scale: 1.0 });
        const scale = targetWidth / unscaledViewport.width;
        
        const dpr = window.devicePixelRatio || 1;
        const viewport = page.getViewport({ scale: scale * dpr });

        pdfCanvas.width = viewport.width;
        pdfCanvas.height = viewport.height;
        pdfCanvas.style.width = `${targetWidth}px`;
        pdfCanvas.style.height = `${(viewport.height / dpr)}px`;

        drawCanvas.width = viewport.width;
        drawCanvas.height = viewport.height;
        drawCanvas.style.width = `${targetWidth}px`;
        drawCanvas.style.height = `${(viewport.height / dpr)}px`;

        sheetCard.style.width = `${targetWidth}px`;

        page.render({
          canvasContext: pdfCtx,
          viewport: viewport
        });
        pageIndicator.textContent = `${num} / ${currentPdfDoc.numPages}`;

        loadPageDrawing(num);
      });
    }

    function updateZoomDisplay() {
      if (zoomLevelText) zoomLevelText.textContent = `${Math.round(zoomScale * 100)}%`;
    }

    function setZoom(newScale) {
      zoomScale = Math.min(Math.max(newScale, 0.6), 2.5);
      updateZoomDisplay();
      if (currentPdfDoc) renderPage(currentPageNum);
    }

    document.getElementById('zoomInBtn').onclick = () => setZoom(zoomScale + 0.15);
    document.getElementById('zoomOutBtn').onclick = () => setZoom(zoomScale - 0.15);
    zoomLevelText.ondblclick = () => setZoom(1.0);

    // ==========================================
    // ✏️ 6. 개인 독립 메모 레이어
    // ==========================================
    let isDrawingMode = false;
    let currentTool = 'pen';
    let isDrawing = false;

    const drawToggleBtn = document.getElementById('drawToggleBtn');
    const drawingToolbar = document.getElementById('drawingToolbar');

    drawToggleBtn.onclick = () => {
      isDrawingMode = !isDrawingMode;
      if (isDrawingMode) {
        drawToggleBtn.classList.add('active');
        drawingToolbar.style.display = 'flex';
        drawCanvas.classList.add('active');
      } else {
        drawToggleBtn.classList.remove('active');
        drawingToolbar.style.display = 'none';
        drawCanvas.classList.remove('active');
      }
    };

    function setDrawTool(tool) {
      currentTool = tool;
      ['toolPenBtn', 'toolBreathBtn', 'toolHighlighterBtn', 'toolEraserBtn'].forEach(id => {
        document.getElementById(id).classList.remove('active');
      });
      if (tool === 'pen') document.getElementById('toolPenBtn').classList.add('active');
      if (tool === 'breath') document.getElementById('toolBreathBtn').classList.add('active');
      if (tool === 'highlighter') document.getElementById('toolHighlighterBtn').classList.add('active');
      if (tool === 'eraser') document.getElementById('toolEraserBtn').classList.add('active');
    }

    document.getElementById('toolPenBtn').onclick = () => setDrawTool('pen');
    document.getElementById('toolBreathBtn').onclick = () => setDrawTool('breath');
    document.getElementById('toolHighlighterBtn').onclick = () => setDrawTool('highlighter');
    document.getElementById('toolEraserBtn').onclick = () => setDrawTool('eraser');

    function getCanvasCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: ((clientX - rect.left) * drawCanvas.width) / rect.width,
        y: ((clientY - rect.top) * drawCanvas.height) / rect.height
      };
    }

    function startDraw(e) {
      if (!isDrawingMode || !drawCtx) return;
      isDrawing = true;
      const { x, y } = getCanvasCoords(e);

      if (currentTool === 'breath') {
        drawBreathMark(x, y);
        isDrawing = false;
        savePageDrawing();
        return;
      }

      drawCtx.beginPath();
      drawCtx.moveTo(x, y);

      if (currentTool === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.lineWidth = 24;
      } else if (currentTool === 'highlighter') {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = 'rgba(250, 204, 21, 0.45)';
        drawCtx.lineWidth = 18;
        drawCtx.lineCap = 'square';
      } else {
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.strokeStyle = '#ef4444';
        drawCtx.lineWidth = 3.5;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
      }
    }

    function drawingMove(e) {
      if (!isDrawing || !drawCtx || currentTool === 'breath') return;
      const { x, y } = getCanvasCoords(e);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
    }

    function endDraw() {
      if (!isDrawing || !drawCtx) return;
      isDrawing = false;
      drawCtx.closePath();
      savePageDrawing();
    }

    function drawBreathMark(x, y) {
      drawCtx.globalCompositeOperation = 'source-over';
      drawCtx.strokeStyle = '#ef4444';
      drawCtx.lineWidth = 4;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      
      const size = 16;
      drawCtx.beginPath();
      drawCtx.moveTo(x - size, y - size);
      drawCtx.lineTo(x, y);
      drawCtx.lineTo(x + size, y - size);
      drawCtx.stroke();
      drawCtx.closePath();
    }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', drawingMove);
    window.addEventListener('mouseup', endDraw);

    drawCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    drawCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawingMove(e); }, { passive: false });
    drawCanvas.addEventListener('touchend', endDraw);

    async function savePageDrawing() {
      if (!currentSong) return;
      const key = `${currentSong.id}_p${currentPageNum}`;
      const dataUrl = drawCanvas.toDataURL();
      await putStored('personal_drawings', { id: key, data: dataUrl });
    }

    async function loadPageDrawing(num) {
      if (!currentSong || !drawCtx) return;
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      const key = `${currentSong.id}_p${num}`;
      const saved = await getStoredItem('personal_drawings', key);
      if (saved && saved.data) {
        const img = new Image();
        img.onload = () => {
          drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
          drawCtx.drawImage(img, 0, 0, drawCanvas.width, drawCanvas.height);
        };
        img.src = saved.data;
      }
    }

    document.getElementById('clearDrawBtn').onclick = async () => {
      if (confirm('현재 페이지의 개인 메모를 모두 지우시겠습니까?')) {
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        await savePageDrawing();
      }
    };

    // ==========================================
    // 🎧 7. 파트별 멀티트랙 오디오 플레이어
    // ==========================================
    const audioBar = document.getElementById('audioBar');
    const guideAudio = document.getElementById('guideAudioElement');
    const audioPlayBtn = document.getElementById('audioPlayBtn');
    const playIconSvg = document.getElementById('playIconSvg');
    const audioTimeText = document.getElementById('audioTimeText');
    const audioRateBtn = document.getElementById('audioRateBtn');
    const partTabSelector = document.getElementById('partTabSelector');

    let currentSongPartAudios = {};
    let activePartTab = 'ALL';

    async function loadSongAudioTracks(song) {
      currentSongPartAudios = {};
      const parts = ['ALL', 'S', 'A', 'T', 'B'];
      let hasAnyAudio = false;

      for (const p of parts) {
        const item = await getStoredItem('part_audios', `${song.id}_${p}`);
        const tabBtn = partTabSelector.querySelector(`[data-part="${p}"]`);
        
        if (item && item.blob) {
          currentSongPartAudios[p] = URL.createObjectURL(item.blob);
          hasAnyAudio = true;
          tabBtn.classList.add('has-audio');
        } else {
          tabBtn.classList.remove('has-audio');
        }
      }

      if (hasAnyAudio) {
        audioBar.classList.add('show');
        const firstAvailable = parts.find(p => currentSongPartAudios[p]) || 'ALL';
        switchPartTrack(firstAvailable, false);
      } else {
        audioBar.classList.remove('show');
        guideAudio.pause();
      }
    }

    function switchPartTrack(part, autoPlay = true) {
      activePartTab = part;
      partTabSelector.querySelectorAll('.part-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.part === part);
      });

      const audioUrl = currentSongPartAudios[part];
      if (audioUrl) {
        const prevTime = guideAudio.currentTime;
        const isPlaying = !guideAudio.paused;
        guideAudio.src = audioUrl;
        guideAudio.currentTime = prevTime;
        if (autoPlay || isPlaying) {
          guideAudio.play();
          playIconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }
      }
    }

    partTabSelector.addEventListener('click', (e) => {
      const tab = e.target.closest('.part-tab');
      if (!tab) return;
      const part = tab.dataset.part;
      if (currentSongPartAudios[part]) {
        switchPartTrack(part, true);
      } else {
        alert(`${part} 파트에 등록된 음원이 없습니다.\n[곡 추가] 모달에서 음원을 등록해주세요.`);
      }
    });

    audioPlayBtn.onclick = () => {
      if (!guideAudio.src) return;
      if (guideAudio.paused) {
        guideAudio.play();
        playIconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        guideAudio.pause();
        playIconSvg.innerHTML = '<path d="M5 3l14 9-14 9V3z"/>';
      }
    };

    guideAudio.ontimeupdate = () => {
      const cur = Math.floor(guideAudio.currentTime);
      const m = Math.floor(cur / 60);
      const s = String(cur % 60).padStart(2, '0');
      audioTimeText.textContent = `${m}:${s}`;
    };

    guideAudio.onended = () => {
      playIconSvg.innerHTML = '<path d="M5 3l14 9-14 9V3z"/>';
    };

    const rates = [1.0, 1.2, 0.8];
    let rateIdx = 0;
    audioRateBtn.onclick = () => {
      rateIdx = (rateIdx + 1) % rates.length;
      const r = rates[rateIdx];
      guideAudio.playbackRate = r;
      audioRateBtn.textContent = `${r}x`;
    };

    document.getElementById('closeAudioBtn').onclick = () => {
      guideAudio.pause();
      audioBar.classList.remove('show');
    };

    // ==========================================
    // 👆 8. 터치 제스처 (스와이프)
    // ==========================================
    const viewerMain = document.getElementById('viewerMain');
    let touchStartX = 0;
    let touchStartY = 0;

    viewerMain.addEventListener('touchstart', (e) => {
      if (isDrawingMode) return;
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    viewerMain.addEventListener('touchend', (e) => {
      if (isDrawingMode) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY) * 1.4) {
        if (diffX < 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    // ==========================================
    // ⚙️ 9. 모달 및 파일 업로드
    // ==========================================
    const metroModal = document.getElementById('metroModal');
    document.getElementById('openMetroModalBtn').onclick = () => metroModal.classList.add('open');
    document.getElementById('closeMetroModalBtn').onclick = () => metroModal.classList.remove('open');

    const pitchModal = document.getElementById('pitchModal');
    document.getElementById('openPitchEditorBtn').onclick = () => {
      if (!currentSong) return;
      document.getElementById('quickS_select').value = currentSong.notes?.S || '';
      document.getElementById('quickA_select').value = currentSong.notes?.A || '';
      document.getElementById('quickT_select').value = currentSong.notes?.T || '';
      document.getElementById('quickB_select').value = currentSong.notes?.B || '';
      pitchModal.classList.add('open');
    };
    document.getElementById('closePitchModalBtn').onclick = () => pitchModal.classList.remove('open');

    document.getElementById('savePitchModalBtn').onclick = async () => {
      if (!currentSong) return;
      const newNotes = {
        S: document.getElementById('quickS_select').value,
        A: document.getElementById('quickA_select').value,
        T: document.getElementById('quickT_select').value,
        B: document.getElementById('quickB_select').value
      };
      await putStored('pitch_overrides', { songId: currentSong.id, notes: newNotes });
      currentSong.notes = newNotes;
      pitchModal.classList.remove('open');
      loadSong(currentSong.id);
    };

    let pendingAudioBlobs = {};
    function handleAudioUpload(part, inputEl) {
      if (inputEl.files && inputEl.files[0]) {
        const file = inputEl.files[0];
        pendingAudioBlobs[part] = file;
        document.getElementById(`status_${part}`).textContent = file.name;
        document.getElementById(`status_${part}`).style.color = '#34d399';
      }
    }

    const linkModal = document.getElementById('linkModal');
    document.getElementById('openLinkModalBtn').onclick = () => {
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputUrl').value = '';
      pendingAudioBlobs = {};
      ['ALL', 'S', 'A', 'T', 'B'].forEach(p => {
        document.getElementById(`status_${p}`).textContent = '미등록';
        document.getElementById(`status_${p}`).style.color = 'var(--text-secondary)';
      });
      linkModal.classList.add('open');
    };
    document.getElementById('closeLinkModalBtn').onclick = () => linkModal.classList.remove('open');

    document.getElementById('saveLinkSongBtn').onclick = async () => {
      const title = document.getElementById('inputTitle').value.trim();
      const url = document.getElementById('inputUrl').value.trim();
      if (!title || !url) { alert('곡 명과 악보 URL을 입력해주세요.'); return; }

      const newSongId = `custom_${Date.now()}`;
      const newSong = {
        id: newSongId,
        type: 'custom',
        title: title,
        url: url,
        notes: {},
        createdAt: Date.now()
      };

      await putStored('custom_songs', newSong);

      for (const [part, blob] of Object.entries(pendingAudioBlobs)) {
        await putStored('part_audios', {
          id: `${newSongId}_${part}`,
          part: part,
          blob: blob
        });
      }

      linkModal.classList.remove('open');
      await loadAllSongList(newSong.id);
    };

    deleteLocalBtn.onclick = async () => {
      if (!currentSong || currentSong.type !== 'custom') return;
      if (confirm(`'${currentSong.title}' 트랙과 등록된 음원을 모두 삭제하시겠습니까?`)) {
        await deleteStored('custom_songs', currentSong.id);
        await deleteStored('pitch_overrides', currentSong.id);
        for (const p of ['ALL', 'S', 'A', 'T', 'B']) {
          await deleteStored('part_audios', `${currentSong.id}_${p}`);
        }
        await loadAllSongList();
      }
    };

    // ==========================================
    // 🎮 10. 내비게이션 & 이벤트
    // ==========================================
    function nextPage() {
      if (currentPdfDoc && currentPageNum < currentPdfDoc.numPages) {
        currentPageNum++;
        renderPage(currentPageNum);
        document.getElementById('viewerMain').scrollTop = 0;
      }
    }
    function prevPage() {
      if (currentPdfDoc && currentPageNum > 1) {
        currentPageNum--;
        renderPage(currentPageNum);
        document.getElementById('viewerMain').scrollTop = 0;
      }
    }

    document.getElementById('nextPage').onclick = nextPage;
    document.getElementById('prevPage').onclick = prevPage;
    document.getElementById('refreshBtn').onclick = () => loadAllSongList(currentSong?.id);
    songSelect.onchange = (e) => { if (e.target.value) loadSong(e.target.value); };

    window.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) nextPage();
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) prevPage();
    });

    document.getElementById('toggleInvert').onclick = () => {
      document.body.classList.toggle('invert-mode');
    };

    async function startApp() {
      try {
        await initDB();
        initPitchSelectOptions();
        await loadConfig();
        await loadAllSongList();
      } catch (err) {
        console.error("오류 발생:", err);
      }
    }

    startApp();
  </script>
</body>
</html>
